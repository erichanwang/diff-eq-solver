{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h2>Nonhomogeneous Linear ODEs with Constant Coefficients</h2>
    </div>
        <form id="solver-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="degree">Order of the Equation:</label>
                    <input type="number" id="degree" name="degree" min="1" max="4" value="2" required>
                </div>
                <div class="form-group">
                    <label for="var_dep">Dependent Variable:</label>
                    <input type="text" id="var_dep" name="var_dep" value="y" required>
                </div>
                <div class="form-group">
                    <label for="var_indep">Independent Variable:</label>
                    <input type="text" id="var_indep" name="var_indep" value="t" required>
                </div>
            </div>
            <div id="equation-inputs">
                <!-- Equation inputs will be dynamically generated here -->
            </div>
            <div id="initial-conditions">
                <h3>Initial Conditions</h3>
                <!-- Initial conditions will be dynamically generated here -->
            </div>
            <button type="submit">Solve</button>
        </form>
        <div id="solution-container">
            <h2>Solution</h2>
            <div id="solution-output">
                <p id="solution-text">\( y(t) = \)</p>
            </div>
            <div id="plain-solution-container">
                <h3>For Copying:</h3>
                <p id="plain-solution-text"></p>
            </div>
        </div>
    </div>
{% endblock %}
